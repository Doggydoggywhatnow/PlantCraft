# How individual plants vary. Sizes are drawn from each species' real range (plants/*.yaml `size`).
# The two numbers below are DESIGN CHOICES, not botanical data; change them freely.
size_correlation: 0.7        # 0 = height and width independent, 1 = a tall plant is always equally wide
unknown_min_fraction: 0.3    # when a source gives only a maximum, the minimum is this fraction of it
rare_tail_probability: 0.03   # chance a plant is a rare giant (between common_max and max) when a species has a common_max
world_seed: 0                # the game replaces this with the real world seed
