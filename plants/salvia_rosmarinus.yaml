uses_real:
- use: Culinary
  note: Leaves flavour stews, stuffing, roasted meats and marinades; herbal tea; the woody stem stripped
    of leaves is used as a skewer.
- use: Food preservative
  note: Extract of carnosic acid and carnosol is approved as a preservative in several countries (E392).
- use: Fragrance
  note: Hungary water (14th century), one of the first alcohol-based perfumes in Europe, is mainly distilled
    rosemary; the oil is used in perfumes, shampoos, cleaning products and aromatherapy.
- use: Ornamental
  note: Drought-tolerant garden and xeriscape plant; pruned into hedges and topiary; groundcover cultivars
    spread widely.
- use: Cultural
  note: Considered sacred to ancient Egyptians, Romans and Greeks.
