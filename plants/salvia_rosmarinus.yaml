growth_stages:
- id: seed
  name: Seed
  description: Small seed; seeds are often difficult to start and have a low germination rate.
  texture: textures/block/salvia_rosmarinus_seed.png
- id: seedling
  name: Seedling
  description: Tiny shoot with a few short needle leaves.
  texture: textures/block/salvia_rosmarinus_seedling.png
- id: young
  name: Young shrub
  description: 'Small shrub: a few woody stems fork from the base, with needle leaves along them. Too
    young to harvest: the bush should mature 2-3 years first.'
  texture: textures/block/salvia_rosmarinus_young.png
- id: mature
  name: Mature shrub
  description: Dense evergreen bush of several branching woody stems with needle leaves along each (green
    above, pale below). Can be harvested (up to 20% of growth).
  texture: textures/block/salvia_rosmarinus_mature.png
  visual_notes: Brown woody stems visible through the needles.
- id: flowering
  name: Flowering
  description: Groups of 2 to 3 small flowers down the length of the branches in white, pink, purple or
    deep blue.
  visual_notes: Blue-violet flower clusters among the needles.
  texture: textures/block/salvia_rosmarinus_flowering.png
segment_textures:
- role: lower
  texture: textures/block/salvia_rosmarinus_lower.png
  note: 'Lower block of the 2-block bush: woody stems with needles and side branches, matching the top
    block''s stems at the join.'
