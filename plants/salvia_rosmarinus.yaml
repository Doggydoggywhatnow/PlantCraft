description: Aromatic evergreen shrub with fibrous roots and fragrant, needle-like leaves similar to Tsuga
  needles. Forms range from upright to trailing; the upright forms reach 1.2-1.8 m. Leaves are 2-4 cm
  long and 2-5 mm broad, green above and white below with dense short woolly hair. Branches are dotted
  with groups of 2 to 3 flowers down their length. Can live as long as 35 years. Reclassified into Salvia
  in 2017; long known as Rosmarinus officinalis.
habitat:
  native_range: Mediterranean region, including Portugal and northwestern Spain.
  introduced_range: Naturalized in China by 220 CE; reached England probably with the Romans; arrived
    in the Americas with early European settlers in the 17th century; now global and potentially invasive.
  environment: Drought-tolerant; 'thrives best by the sea' (Elizabeth Kent, 1823, quoted by Wikipedia).
    Hardy in cool climates; cultivar 'Arp' survives about -20 C.
  climate: Mediterranean
  life_form: shrub
  height_m: 1.2-1.8 (upright forms)
