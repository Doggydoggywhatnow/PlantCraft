implementation:
  type: flower_fruit_plant
  behavior: harvest_sprigs
  growth:
    summary: Slow-growing evergreen shrub. Seed, seedling, young shrub, mature shrub; flowers on the mature
      shrub.
    requirements:
    - Full light
    - Dry or sandy soil; survives long dry spells (drought-tolerant)
    - Frost-tolerant in cold-hardy cultivars only
    flowering: Flower stage can appear at any season on a mature shrub (the real plant flowers outside
      its normal season).
    pollination: Not stated in sources; bees could be used as a gameplay choice.
    fruiting: None modelled (not described in the sources).
    regrowth: Harvesting sprigs cuts the leaves back; real guidance is to take no more than 20% of the
      growth and only from bushes at least 2-3 years old.
  spawn:
    biomes:
    - minecraft:savanna
    - minecraft:windswept_savanna
    - minecraft:stony_shore
    feature: patch
    rarity: uncommon
    reason: 'Mediterranean, drought-tolerant and ''thrives best by the sea'': dry open ground and rocky
      coasts are the closest vanilla matches.'
  drops:
  - rosemary sprig
  - seeds
  notes: 'Harvest rule from Wikipedia: no more than 20% of the growth; bush matured 2-3 years. Lifespan
    up to 35 years.'
game_uses:
  summary: 'Not yet designed (use phase). Real uses recorded above: culinary seasoning and tea, preservative,
