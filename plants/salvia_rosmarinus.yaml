    - purple
    - deep blue
    opens: continuous
    season: spring and summer in temperate climates; may bloom constantly in warm climates; known to flower
      as late as early December and as early as mid-February (Northern Hemisphere)
    notes: Pollinator is not stated in the fetched sources.
