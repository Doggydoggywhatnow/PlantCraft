id: ipomoea_tricolor
status:
  data: draft
  graphics: pending
  implementation: pending
  use: pending
confidence: high
taxonomy:
  kingdom: Plantae
  clade: Tracheophyta
  order: Solanales
  family: Convolvulaceae
  genus: Ipomoea
  species: tricolor
  authority: Cav.
names:
  scientific: Ipomoea tricolor
  common:
  - Mexican morning glory
  - morning glory
  - grannyvine
  - Ololiuqui or Mexican Morning Glory
  - Tlitliltzin
  in_game: Morning Glory
description: Herbaceous annual or perennial twining liana growing 2-4 m tall. Leaves spirally arranged,
  3-7 cm long on 1.5-6 cm stalks. Trumpet-shaped flowers 4-9 cm across, most commonly blue with a white
  to golden-yellow centre. In the cultivar 'Heavenly Blue' the flower colour changes from red to blue
  as the bloom ages.
habitat:
  native_range: Tropics of the Americas.
  introduced_range: Widely cultivated and naturalised elsewhere.
  environment: Warm, sheltered and sunny; climbs walls and supports.
  climate: Does not tolerate below 5 C
  life_form: vine
  height_m: 2-4
growth_stages:
- id: seed
  name: Seed
  description: Seed planted next to a block it can climb.
  texture: textures/block/ipomoea_tricolor_seed.png
- id: sprout
  name: Sprout
  description: Small twining shoot with two seed leaves.
  texture: textures/block/ipomoea_tricolor_sprout.png
- id: climbing
  name: Climbing vine
  description: Twining stems with heart-shaped leaves covering the support.
  texture: textures/block/ipomoea_tricolor_climbing.png
- id: budding
  name: Budding
  description: Tightly furled twisted buds along the vine.
  texture: textures/block/ipomoea_tricolor_budding.png
- id: flowering
  name: Flowering
  description: Blue trumpet flowers with white centres open. Flower colour shifts red to blue during the
    bloom ('Heavenly Blue').
  visual_notes: Open blue trumpets in the morning; closed twisted purple-pink furls by afternoon.
  texture: textures/block/ipomoea_tricolor_flowering.png
- id: seed_pod
  name: Seed pod
  description: Small dry round seed pods replace the spent flowers.
  texture: textures/block/ipomoea_tricolor_seed_pod.png
reproduction:
  flowers:
    present: true
    colors:
    - blue
    - white
    - golden yellow centre
    opens: morning_only
    pollination:
    - bees
    notes: 'Flower opening time (morning glory) is common knowledge but the fetched Wikipedia text does
      not state it: verify in a primary source.'
  fruit:
    present: true
    type: seed capsule
    description: Dry capsule with seeds. Seeds contain ergoline alkaloids (LSA, LSH) produced with a symbiotic
      fungus, Periglandula ipomoeae.
    edible: toxic
uses_real:
- use: Ornamental
  note: Many cultivars; 'Heavenly Blue' won the RHS Award of Garden Merit.
- use: Weed control / cover plant
  note: Phytotoxic effects inhibit weed seedling growth; Mexican farmers promote it as a cover plant before
    sowing crops such as sugarcane, then work it into the soil.
- use: Toxic seeds
  note: Seeds contain ergoline alkaloids and cause sickness.
