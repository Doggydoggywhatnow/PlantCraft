implementation:
  type: climbing_vine
  growth:
    summary: Planted beside a solid block, climbs it like a vine. Flowers by day, seed pods after.
    requirements:
    - Light level 9 or more
    - Adjacent supporting block
    - 'Frost-sensitive: stalls in cold biomes'
    flowering: Flower stage open in the morning, closed by afternoon.
    pollination: Bees pollinate open flowers; or self-pollination chance.
    fruiting: Pollinated flowers become seed pods; pods drop seeds.
    regrowth: Harvested vine returns to the budding stage.
  spawn:
    biomes:
    - minecraft:jungle
    - minecraft:sparse_jungle
    - minecraft:savanna
    - minecraft:plains
    feature: vine_on_wall
    rarity: uncommon
    reason: Native to the tropics of the Americas and killed by cold.
  drops:
  - seeds
  - flower (blue dye)
  notes: 'Weed-suppression could become a use: plant growing nearby clears weeds.'
game_uses:
  summary: 'Not yet designed (use phase). Real uses recorded above: ornamental, weed control, toxic seeds.'
