reproduction:
  flowers:
    present: true
    colors:
    - white
    - yellowish white
    opens: continuous
    season: 'PFAF: August to September (species level; not stated in Wikipedia). Buds grow slowly for
      4-6 weeks before blooming.'
    pollination:
    - wind
    notes: 'Sources disagree on fertility: PFAF says wind-pollinated and self-fertile; Wikipedia says
      many cultivars are almost or completely self-incompatible and are planted in pairs (a primary and
      a secondary cultivar), with a two-group self-incompatibility system.'
  fruit:
    present: true
    type: drupe
    description: Small drupe 1-2.5 cm long when ripe; the pericarp is usually 60-70% oil. Raw olives are
      very bitter and astringent (oleuropein) and are cured or fermented to be eaten, or pressed for oil.
    ripening: Harvested from October onward in the Mediterranean
    edible: 'yes'
uses_real:
- use: Table olives
  note: Eaten after curing and fermentation; green olives are picked unripe at full size, semi-ripe ones
    when turning colour, black olives at full maturity.
- use: Olive oil
  note: Pressed from the fruit; typical yield 1.5-2.2 kg of oil per tree per year; formerly also used
    as lamp fuel.
- use: Wood
  note: Hard, straight-grained and dense; used for decorative objects, not outdoors.
- use: Ornamental
  note: Planted for gnarled trunks and evergreen silvery-grey foliage; smaller cultivars are used as indoor
    plants.
- use: Symbol
  note: The olive branch is a symbol of peace.
