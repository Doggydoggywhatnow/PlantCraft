description: 'Subtropical evergreen tree that grows in a Mediterranean climate. The trunk is typically
  gnarled and twisted; the tree grows to some 10 m with grey bark. Leaves are oblong, grey-green above
  and whitish below. Small white flowers grow in erect racemes from the leaf axils, mostly on the previous
  year''s wood. The fruit is a small drupe 1-2.5 cm long when ripe, with a stone (pit); wild olives have
  thinner-fleshed, smaller fruit than cultivated ones. Slow-growing and long-lived: productive for centuries
  when pruned. This is the cultivated olive (subspecies europaea of Olea europaea).'
habitat:
  native_range: Origins 20-40 million years ago in what is now Italy and the eastern Mediterranean; modern
    cultivars trace mainly to the Near East, the Aegean Sea and the Strait of Gibraltar.
  introduced_range: Cultivated across the Mediterranean basin and in Argentina, Australia, Chile and Peru;
    brought to the New World by Spanish colonists in the 18th century and to Japan in 1908. Feral olives
    have escaped repeatedly; a serious invasive species in South Australia.
  environment: Prefers calcareous soils; grows best on limestone slopes and crags and in coastal climates.
    Any light soil, even well-drained clay; rich soils predispose it to disease. Hot weather and sun,
    no shade. Drought-tolerant thanks to a sturdy, extensive root system.
  climate: Mediterranean; below -10 C may injure even a mature tree, but the rootstock survives and resprouts
  life_form: tree
  height_m: about 10
