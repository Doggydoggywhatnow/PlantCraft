growth_stages:
- id: seed
  name: Stone
  description: The hard, pitted stone (pit) of the olive fruit; the seed is inside.
  texture: textures/block/olea_europaea_europaea_seed.png
- id: sapling
  name: Sapling
  description: Slim young tree with a thin grey stem and a few narrow grey-green leaves.
  texture: textures/block/olea_europaea_europaea_sapling.png
- id: young_tree
  name: Young tree
  description: Slow-growing young tree with a grey, beginning-to-twist trunk and twigs bearing oblong
    grey-green leaves.
  texture: textures/block/olea_europaea_europaea_young_tree.png
- id: mature_tree
  name: Mature tree
  description: Evergreen tree with a gnarled, twisted grey trunk and branches; leaves grey-green above
    and whitish below give a silvery look.
  visual_notes: Silvery foliage, twisted grey limbs.
  texture: textures/block/olea_europaea_europaea_mature_tree.png
- id: flowering
  name: Flowering
  description: Small white flowers (four yellowish-white petals) in erect racemes from the leaf axils
    on last year's twigs; a bloom lasts 5-6 days in hot weather, 2 weeks in colder areas.
  texture: textures/block/olea_europaea_europaea_flowering.png
- id: unripe
  name: Unripe fruit
  description: Small drupes at full size but unripe, shades of green to yellow.
  texture: textures/block/olea_europaea_europaea_unripe.png
- id: ripe
  name: Ripe fruit
  description: Ripe drupes 1-2.5 cm long turning through red-brown to purple, brown or black; picked from
    October onward in the Mediterranean.
  texture: textures/block/olea_europaea_europaea_ripe.png
