id: datura_metel
status:
  data: draft
  graphics: pending
  implementation: pending
  use: pending
confidence: high
taxonomy:
  kingdom: Plantae
  clade: Tracheophyta
  order: Solanales
  family: Solanaceae
  genus: Datura
  species: metel
  authority: L.
names:
  scientific: Datura metel
  common:
  - devil's trumpet
  - Hindu thorn-apple
  - Hindu datura
  in_game: Devil'S Trumpet
description: Annual or short-lived shrubby perennial up to 1.8 m. Stems hollow, green or purple-black,
  strongly scented. Leaves oval, entire or deeply lobed, often dark violet. Flowers are enormously varied.
  Wikipedia describes it as an assemblage of ancient pre-Columbian cultivars rather than a true wild species.
habitat:
  native_range: The Americas, probably the Greater Antilles.
  introduced_range: Reached the Indian subcontinent no later than the 4th century CE; now pantropical.
  environment: Warm regions; weedy.
  height_m: up to 1.8
  life_form: annual_herb
growth_stages:
- id: seed
  name: Seed
  description: Small black seed, flat and kidney-shaped, planted in soil.
  visual_notes: Item sprite only.
  texture: textures/block/datura_metel_seed.png
- id: seedling
  name: Seedling
  description: Two small green seed leaves on a short stalk.
  visual_notes: Low, 1 pixel stem.
  texture: textures/block/datura_metel_seedling.png
- id: vegetative
  name: Vegetative
  description: Leafy branched herb or shrub with broad, toothed or wavy leaves.
  visual_notes: Full-height green bush, no flowers.
  texture: textures/block/datura_metel_vegetative.png
- id: budding
  name: Budding
  description: Long tubular buds appear in leaf axils and branch forks, twisted and furled.
  visual_notes: Bush with pale, closed, pencil-like buds.
  texture: textures/block/datura_metel_budding.png
- id: flowering
  name: Flowering
  description: Large trumpet-shaped flowers open (see flower notes for timing and colour).
  visual_notes: Wide trumpet flowers on top of the bush.
  texture: textures/block/datura_metel_flowering.png
- id: fruiting
  name: Fruiting
  description: Petals fall and a green spiny seed capsule swells.
  visual_notes: Green spiny ball where the flower was.
  texture: textures/block/datura_metel_fruiting.png
- id: ripe_capsule
  name: Ripe capsule
  description: Capsule browns and splits open, showing black seeds.
  visual_notes: Brown split capsule with dark seeds visible.
  texture: textures/block/datura_metel_ripe_capsule.png
reproduction:
  flowers:
    present: true
    colors:
    - white
    - cream
    - yellow
    - red
    - violet
    opens: night
    season: summer
    pollination:
    - moths
    notes: 'Pleasantly scented, 15-20 cm, single or double (hose-in-hose). Colour varies widely: a good
      place for flower colour variants.'
  fruit:
    present: true
    type: capsule
    description: Covered in conical warts or short, sparse spines; breaks up irregularly rather than splitting
      in four valves.
    edible: toxic
uses_real:
- use: Toxic plant
  note: All Datura species contain tropane alkaloids and are poisonous to people and animals; Wikipedia
    notes use in traditional medicine and ritual (Datura genus article).
