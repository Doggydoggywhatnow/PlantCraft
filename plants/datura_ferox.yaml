id: datura_ferox
status:
  data: draft
  graphics: done
  implementation: pending
  use: pending
confidence: medium
taxonomy:
  kingdom: Plantae
  clade: Tracheophyta
  order: Solanales
  family: Solanaceae
  genus: Datura
  species: ferox
  authority: L.
names:
  scientific: Datura ferox
  common:
  - long-spined thorn-apple
  - fierce thorn-apple
  - large thorn-apple
  - long-spine thorn-apple
  in_game: Long-Spined Thorn-Apple
description: Stout upright annual herb 45-90 cm tall, red-violet at the stem base, young shoots hairy.
  Very wide, undulate, irregularly toothed leaves with soft downy hairs. Yellowish-white funnel flowers
  are inconspicuous and usually do not open fully.
habitat:
  native_range: The Americas (long thought to be southeastern China, now corrected by Symon and Haegi).
  introduced_range: Warm parts of the earth, where it is a pasture weed.
  environment: Pasture and disturbed ground.
  height_m: 0.45-0.9
  life_form: annual_herb
size:
  height_cm:
    min: 45
    max: 90
  habit: upright
  source: wikipedia
  quote: stout, upright annual herb 1.5 to 3 ft (45 to 90 cm) high
  height_sources:
  - name: 'Wikipedia: Datura ferox'
    url: https://en.wikipedia.org/wiki/Datura_ferox
    min: 45
    max: 90
    quote: stout, upright annual herb 1.5 to 3 ft (45 to 90 cm) high
growth_stages:
- id: seed
  name: Seed
  description: Small black seed, flat and kidney-shaped, planted in soil.
  visual_notes: Item sprite only.
  texture: textures/block/datura_ferox_seed.png
- id: seedling
  name: Seedling
  description: Two small green seed leaves on a short stalk.
  visual_notes: Low, 1 pixel stem.
  texture: textures/block/datura_ferox_seedling.png
- id: vegetative
  name: Vegetative
  description: Leafy plant whose stem forks repeatedly into branches, with a leaf at each fork.
  visual_notes: Forking stems (second fork visible), oval leaves at the forks, no flowers.
  texture: textures/block/datura_ferox_vegetative.png
- id: budding
  name: Budding
  description: Long tubular buds form at the ends of the branches.
  visual_notes: Pale furled buds on the branch tips.
  texture: textures/block/datura_ferox_budding.png
- id: flowering
  name: Flowering
  description: A single large trumpet-shaped flower opens at the tip of each branch (flower timing and
    colour in reproduction.flowers).
  visual_notes: One trumpet on each branch tip.
  texture: textures/block/datura_ferox_flowering.png
- id: fruiting
  name: Fruiting
  description: Petals fall and a green spiny seed capsule swells at the tip of each branch.
  visual_notes: Outlined spiny capsule on each branch tip.
  texture: textures/block/datura_ferox_fruiting.png
- id: ripe_capsule
  name: Ripe capsule
  description: Each capsule browns and splits open, showing black seeds, on the branch tips.
  visual_notes: Split brown capsules on the branch tips.
  texture: textures/block/datura_ferox_ripe_capsule.png
reproduction:
  flowers:
    present: true
    colors:
    - yellowish white
    opens: night
    pollination:
    - moths
    notes: Flowers are small and may not open fully.
  fruit:
    present: true
    type: capsule
    description: Red-brown when ripe with unusually long thorns (ferox means strongly fortified).
    edible: toxic
uses_real:
- use: Toxic plant
  note: All Datura species contain tropane alkaloids and are poisonous to people and animals; Wikipedia
    notes use in traditional medicine and ritual (Datura genus article).
