description: Tall perennial reed or cane, generally 6 m, with hollow stems, grey-green swordlike leaves
  and upright white feathery plumes.
habitat:
  native_range: Eastern Mediterranean region and across southern Asia to Japan
  environment: Damp soils, fresh or moderately saline; dense stands on disturbed sites, dunes, wetlands
    and riparian habitats.
  introduced_range: Widely planted and naturalised in mild temperate, subtropical and tropical regions;
    invasive in North America and Oceania.
