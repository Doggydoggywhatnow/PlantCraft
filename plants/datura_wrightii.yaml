id: datura_wrightii
status:
  data: draft
  graphics: pending
  implementation: pending
  use: pending
confidence: high
taxonomy:
  kingdom: Plantae
  clade: Tracheophyta
  order: Solanales
  family: Solanaceae
  genus: Datura
  species: wrightii
  authority: Regel
  synonyms:
  - Datura lanosa (disputed)
names:
  scientific: Datura wrightii
  common:
  - sacred thorn-apple
  - sacred datura
  - hairy thorn-apple
  in_game: Sacred Thorn-Apple
description: Vigorous herbaceous perennial 30 cm to 1.5 m tall and wide, often sprawling close to the
  ground. Broad leaves with wavy margins. Large sweetly fragrant white trumpet flowers, sometimes purple-tinted
  at the margin.
habitat:
  native_range: Northern Mexico and the adjoining southwestern United States, as far north as eastern
    Washington.
  introduced_range: Garden escape in New South Wales, Victoria, South Australia and Western Australia.
  environment: Open or disturbed land and roadsides with well-drained sandy soils; very sunny and exposed.
  climate: Hot, dry
  height_m: 0.3-1.5
  life_form: perennial_herb
growth_stages:
- id: seed
  name: Seed
  description: Small black seed, flat and kidney-shaped, planted in soil.
  visual_notes: Item sprite only.
  texture: textures/block/datura_wrightii_seed.png
- id: seedling
  name: Seedling
  description: Two small green seed leaves on a short stalk.
  visual_notes: Low, 1 pixel stem.
  texture: textures/block/datura_wrightii_seedling.png
- id: vegetative
  name: Vegetative
  description: Leafy branched herb or shrub with broad, toothed or wavy leaves.
  visual_notes: Full-height green bush, no flowers.
  texture: textures/block/datura_wrightii_vegetative.png
- id: budding
  name: Budding
  description: Long tubular buds appear in leaf axils and branch forks, twisted and furled.
  visual_notes: Bush with pale, closed, pencil-like buds.
  texture: textures/block/datura_wrightii_budding.png
- id: flowering
  name: Flowering
  description: Large trumpet-shaped flowers open (see flower notes for timing and colour).
  visual_notes: Wide trumpet flowers on top of the bush.
  texture: textures/block/datura_wrightii_flowering.png
- id: fruiting
  name: Fruiting
  description: Petals fall and a green spiny seed capsule swells.
  visual_notes: Green spiny ball where the flower was.
  texture: textures/block/datura_wrightii_fruiting.png
- id: ripe_capsule
  name: Ripe capsule
  description: Capsule browns and splits open, showing black seeds.
  visual_notes: Brown split capsule with dark seeds visible.
  texture: textures/block/datura_wrightii_ripe_capsule.png
reproduction:
  flowers:
    present: true
    colors:
    - white
    - white with purple tint
    opens: night
    season: April to October
    pollination:
    - moths
    notes: Trumpets up to 20 cm long with five points on the rim. In clear weather they open in the morning
      and evening and close in the heat of the day; in cloudy weather they open earlier and last longer.
  fruit:
    present: true
    type: capsule
    description: Spiny, globular, 3-4 cm across, hanging; opens when fully ripe.
    ripening: After flowering, summer to autumn
    edible: toxic
uses_real:
- use: Toxic plant
  note: All Datura species contain tropane alkaloids and are poisonous to people and animals; Wikipedia
    notes use in traditional medicine and ritual (Datura genus article).
