implementation:
  type: flower_fruit_plant
  growth:
    summary: Grows through the seven genus-template stages (seed to ripe capsule) on random ticks.
    requirements:
    - Light level 9 or more to advance
    - Plantable on sand, dirt, grass or similar soil
    flowering: Flower stage is shown according to flowers.opens; closed or wilted outside those hours.
    pollination: Bees or moths in range, or self-pollination chance per random tick.
    fruiting: Pollinated flower becomes a spiny capsule, which ripens and splits.
    regrowth: Harvested plant returns to the budding stage so it can flower and fruit again.
  spawn:
    biomes:
    - minecraft:desert
    - minecraft:badlands
    feature: patch
    rarity: uncommon
    reason: Native to dry, sandy, well-drained ground in Mexico and the southwestern United States.
  drops:
  - seeds
  - capsule (toxic, not food)
  notes: 'Flower opening is tied to heat and cloud in the real plant: a good candidate for opening in
    the evening and closing in bright midday light. Stage list is the shared Datura genus template, not
    species-specific observations.'
