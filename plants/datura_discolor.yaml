id: datura_discolor
status:
  data: draft
  graphics: pending
  implementation: pending
  use: pending
confidence: high
taxonomy:
  kingdom: Plantae
  clade: Tracheophyta
  order: Solanales
  family: Solanaceae
  genus: Datura
  species: discolor
  authority: Bernh.
names:
  scientific: Datura discolor
  common:
  - desert thorn-apple
  in_game: Desert Thorn-Apple
description: Herbaceous annual, upright or low-lying shrub up to 1.4 m with light green foliage and conspicuous
  purple-striped stalks. Ovate leaves, whole or toothed. Large upward-growing trumpet flowers.
habitat:
  native_range: Sonoran Desert of western North America.
  environment: Sandy soils and washes.
  climate: Hot desert
  height_m: up to 1.4
  life_form: annual_herb
growth_stages:
- id: seed
  name: Seed
  description: Small black seed, flat and kidney-shaped, planted in soil.
  visual_notes: Item sprite only.
  texture: textures/block/datura_discolor_seed.png
- id: seedling
  name: Seedling
  description: Two small green seed leaves on a short stalk.
  visual_notes: Low, 1 pixel stem.
  texture: textures/block/datura_discolor_seedling.png
- id: vegetative
  name: Vegetative
  description: Leafy branched herb or shrub with broad, toothed or wavy leaves.
  visual_notes: Full-height green bush, no flowers.
  texture: textures/block/datura_discolor_vegetative.png
- id: budding
  name: Budding
  description: Long tubular buds appear in leaf axils and branch forks, twisted and furled.
  visual_notes: Bush with pale, closed, pencil-like buds.
  texture: textures/block/datura_discolor_budding.png
- id: flowering
  name: Flowering
  description: Large trumpet-shaped flowers open (see flower notes for timing and colour).
  visual_notes: Wide trumpet flowers on top of the bush.
  texture: textures/block/datura_discolor_flowering.png
- id: fruiting
  name: Fruiting
  description: Petals fall and a green spiny seed capsule swells.
  visual_notes: Green spiny ball where the flower was.
  texture: textures/block/datura_discolor_fruiting.png
- id: ripe_capsule
  name: Ripe capsule
  description: Capsule browns and splits open, showing black seeds.
  visual_notes: Brown split capsule with dark seeds visible.
  texture: textures/block/datura_discolor_ripe_capsule.png
reproduction:
  flowers:
    present: true
    colors:
    - white
    - pale to dark violet toward the base
    opens: night
    pollination:
    - moths
    notes: Flowers open for only one night and wither the following day. Epithet discolor refers to the
      white bell over a violet base.
  fruit:
    present: true
    type: capsule
    description: Thorny capsule up to 7.6 cm long and 6.4 cm across.
    edible: toxic
uses_real:
- use: Toxic plant
  note: All Datura species contain tropane alkaloids and are poisonous to people and animals; Wikipedia
    notes use in traditional medicine and ritual (Datura genus article).
images:
- url: https://commons.wikimedia.org/wiki/File%3AWhiteflower8.jpg
  license: Public domain
  author: Neelix at English Wikipedia
  shows: Whiteflower8
sources:
- name: 'Wikipedia: Datura discolor'
  url: https://en.wikipedia.org/wiki/Datura_discolor
  status: checked
- name: Wikidata
  url: https://www.wikidata.org/wiki/Q4115561
  id: Q4115561
  status: checked
- name: 'GBIF (ACCEPTED: Datura discolor)'
  url: https://www.gbif.org/species/2928735
  id: '2928735'
  status: checked
- name: Plants of the World Online (Kew)
  url: https://powo.science.kew.org
  status: pending
implementation:
  type: flower_fruit_plant
  growth:
    summary: Grows through the seven genus-template stages (seed to ripe capsule) on random ticks.
    requirements:
    - Light level 9 or more to advance
    - Plantable on sand, dirt, grass or similar soil
    flowering: Flower stage is shown according to flowers.opens; closed or wilted outside those hours.
    pollination: Bees or moths in range, or self-pollination chance per random tick.
    fruiting: Pollinated flower becomes a spiny capsule, which ripens and splits.
    regrowth: Harvested plant returns to the budding stage so it can flower and fruit again.
  spawn:
    biomes:
    - minecraft:desert
    - minecraft:badlands
    feature: patch
    rarity: common
    reason: Native to dry, sandy, well-drained ground in Mexico and the southwestern United States.
  drops:
  - seeds
  - capsule (toxic, not food)
  notes: 'Very short flower window (one night): a strong candidate for a flower that withers after one
    in-game night. Stage list is the shared Datura genus template, not species-specific observations.'
game_uses:
  summary: Not yet designed (use phase).
