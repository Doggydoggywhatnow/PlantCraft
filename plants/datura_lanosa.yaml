id: datura_lanosa
status:
  data: draft
  graphics: done
  implementation: pending
  use: pending
confidence: low
taxonomy:
  kingdom: Plantae
  clade: Tracheophyta
  order: Solanales
  family: Solanaceae
  genus: Datura
  species: lanosa
  authority: A.S.Barclay ex Bye
names:
  scientific: Datura lanosa
  common:
  - datura
  in_game: Datura lanosa
description: 'Small shrub with trumpet-shaped flowers and a small thorny fruit carrying many seeds. Native
  to Mexico. Sources for this species are thin: Wikipedia has a stub saying some botanists treat it as
  a variety of D. wrightii or D. innoxia, and GBIF lists it as a synonym of D. wrightii. Everything below
  that is not stated here is the Datura genus template, not an observation of this species.'
habitat:
  native_range: Mexico.
  environment: Not yet researched (sources pending).
  height_m: small shrub
  life_form: shrub
growth_stages:
- id: seed
  name: Seed
  description: Small black seed, flat and kidney-shaped, planted in soil.
  visual_notes: Item sprite only.
  texture: textures/block/datura_lanosa_seed.png
- id: seedling
  name: Seedling
  description: Two small green seed leaves on a short stalk.
  visual_notes: Low, 1 pixel stem.
  texture: textures/block/datura_lanosa_seedling.png
- id: vegetative
  name: Vegetative
  description: Leafy branched herb or shrub with broad, toothed or wavy leaves.
  visual_notes: Full-height green bush, no flowers.
  texture: textures/block/datura_lanosa_vegetative.png
- id: budding
  name: Budding
  description: Long tubular buds appear in leaf axils and branch forks, twisted and furled.
  visual_notes: Bush with pale, closed, pencil-like buds.
  texture: textures/block/datura_lanosa_budding.png
- id: flowering
  name: Flowering
  description: Large trumpet-shaped flowers open (see flower notes for timing and colour).
  visual_notes: Wide trumpet flowers on top of the bush.
  texture: textures/block/datura_lanosa_flowering.png
- id: fruiting
  name: Fruiting
  description: Petals fall and a green spiny seed capsule swells.
  visual_notes: Green spiny ball where the flower was.
  texture: textures/block/datura_lanosa_fruiting.png
- id: ripe_capsule
  name: Ripe capsule
  description: Capsule browns and splits open, showing black seeds.
  visual_notes: Brown split capsule with dark seeds visible.
  texture: textures/block/datura_lanosa_ripe_capsule.png
reproduction:
  flowers:
    present: true
    opens: night
    pollination:
    - moths
    notes: Genus default; not species-specific.
  fruit:
    present: true
    type: capsule
    description: Small, thorny, with many seeds.
    edible: toxic
uses_real:
- use: Toxic plant
  note: All Datura species contain tropane alkaloids and are poisonous to people and animals; Wikipedia
    notes use in traditional medicine and ritual (Datura genus article).
images: []
sources:
- name: 'Wikipedia: Datura lanosa'
  url: https://en.wikipedia.org/wiki/Datura_lanosa
  status: checked
- name: Wikidata
  url: https://www.wikidata.org/wiki/Q5227801
  id: Q5227801
  status: checked
- name: 'GBIF (SYNONYM: Datura lanosa)'
  url: https://www.gbif.org/species/2928741
  id: '2928741'
  status: checked
- name: Plants of the World Online (Kew)
  url: https://powo.science.kew.org
  status: pending
implementation:
  type: flower_fruit_plant
  growth:
    summary: Grows through the seven genus-template stages (seed to ripe capsule) on random ticks.
    requirements:
    - Light level 9 or more to advance
    - Plantable on sand, dirt, grass or similar soil
    flowering: Flower stage is shown according to flowers.opens; closed or wilted outside those hours.
    pollination: Bees or moths in range, or self-pollination chance per random tick.
    fruiting: Pollinated flower becomes a spiny capsule, which ripens and splits.
    regrowth: Harvested plant returns to the budding stage so it can flower and fruit again.
  spawn:
    biomes:
    - minecraft:desert
    - minecraft:badlands
    feature: patch
    rarity: uncommon
    reason: 'Placeholder: close to D. wrightii / D. innoxia.'
  drops:
  - seeds
  - capsule (toxic, not food)
  notes: GBIF treats this name as a synonym of D. wrightii; Kew lists it as accepted. Stage list is the
    shared Datura genus template, not species-specific observations.
game_uses:
  summary: Not yet designed (use phase).
