description: Erect, freely branching annual herb forming a bush 60 to 150 cm tall. Each fork of the stem
  bears a leaf and a single erect flower. Leaves 8-20 cm, toothed and undulate. A widespread weed, the
  best known of the genus.
habitat:
  native_range: 'Not settled; genus is centred on Mexico (see Wikipedia: Datura). Now widespread worldwide.'
  environment: Disturbed ground, field edges and waste places (weedy).
  height_m: 0.6-1.5
  life_form: annual_herb
