growth_stages:
- id: seed
  name: Seed
  description: Small black seed, flat and kidney-shaped, planted in soil.
  visual_notes: Item sprite only.
  texture: textures/block/datura_stramonium_seed.png
- id: seedling
  name: Seedling
  description: Two small green seed leaves on a short stalk.
  visual_notes: Low, 1 pixel stem.
  texture: textures/block/datura_stramonium_seedling.png
- id: vegetative
  name: Vegetative
  description: Leafy plant whose stem forks repeatedly into branches, with a leaf at each fork.
  visual_notes: Forking stems (second fork visible), oval leaves at the forks, no flowers.
  texture: textures/block/datura_stramonium_vegetative.png
- id: budding
  name: Budding
  description: Long tubular buds form at the ends of the branches.
  visual_notes: Pale furled buds on the branch tips.
  texture: textures/block/datura_stramonium_budding.png
- id: flowering
  name: Flowering
  description: A single large trumpet-shaped flower opens at the tip of each branch (flower timing and
    colour in reproduction.flowers).
  visual_notes: One trumpet on each branch tip.
  texture: textures/block/datura_stramonium_flowering.png
- id: fruiting
  name: Fruiting
  description: Petals fall and a green spiny seed capsule swells at the tip of each branch.
  visual_notes: Outlined spiny capsule on each branch tip.
  texture: textures/block/datura_stramonium_fruiting.png
- id: ripe_capsule
  name: Ripe capsule
  description: Each capsule browns and splits open, showing black seeds, on the branch tips.
  visual_notes: Split brown capsules on the branch tips.
  texture: textures/block/datura_stramonium_ripe_capsule.png
segment_textures:
- role: lower
  texture: textures/block/datura_stramonium_lower.png
  note: Leafy stem block placed under the stage texture when this plant grows past 1 block (real height
    > 1 m).
reproduction:
  flowers:
    present: true
    colors:
    - white
    - cream
    - violet
    opens: night
    season: throughout summer
    pollination:
    - moths
    notes: Fragrant, trumpet-shaped, 6-9 cm. Flowers open at night and are fed on by nocturnal moths.
  fruit:
    present: true
    type: capsule
    description: Egg-shaped, 3-8 cm across, spiny or smooth; splits into four chambers each holding dozens
      of small black seeds.
    ripening: Late summer
    edible: toxic
uses_real:
- use: Toxic plant
  note: All Datura species contain tropane alkaloids and are poisonous to people and animals; Wikipedia
    notes use in traditional medicine and ritual (Datura genus article).
