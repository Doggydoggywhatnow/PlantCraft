id: prunus_persica
status:
  data: draft
  graphics: done
  implementation: pending
  use: pending
confidence: high
taxonomy:
  kingdom: Plantae
  clade: Tracheophyta
  order: Rosales
  family: Rosaceae
  genus: Prunus
  species: persica
  authority: (L.) Batsch (per Wikipedia; GBIF lists (L.) Stokes)
  synonyms:
  - Amygdalus persica L.
names:
  scientific: Prunus persica
  common:
  - peach
  in_game: Peach Tree
description: Deciduous tree (or tree-like shrub), typically 3 m tall, rarely up to 10 m, with a crown
  about as wide as it is tall and a dark grey trunk. Relatively short-lived, usually under 20 years. Leaves
  oblong to lanceolate, 7-15 cm long, serrated and folded along the midrib. Bears edible juicy drupes;
  smooth-skinned forms are nectarines.
habitat:
  native_range: China (first domesticated there in the Neolithic).
  introduced_range: Spread via Persia to Europe; now grown worldwide in temperate climates.
  environment: Temperate orchards; cultivated. Roots keep growing through winter.
  life_form: tree
  height_m: 3-10
size:
  height_cm:
    min: 300
    max: 1000
  spread_cm:
    min: 300
    max: 400
  habit: tree
  source: wikipedia
  quote: rarely up to 10 meters, more typically 3 m; crown spread ranges 3 to 4 m
growth_stages:
- id: sapling
  name: Sapling
  description: Thin whip with a few leaves.
  texture: textures/block/prunus_persica_sapling.png
- id: young_tree
  name: Young tree
  description: Single trunk with green leaves; too young to flower (real trees fruit 2-3 years after sprouting).
  texture: textures/block/prunus_persica_young.png
- id: budding
  name: Budding
  description: Bare-looking twigs with swollen buds; flowers appear before leaves in the real tree.
  texture: textures/block/prunus_persica_budding.png
- id: blossom
  name: Blossom
  description: Pink flowers cover the branches (single, 2-3.5 cm, four or five cup-shaped petals; dark
    purple-red anthers).
  visual_notes: Leaf blocks replaced by pink blossom leaves.
  texture: textures/block/prunus_persica_blossom.png
- id: fruit_set
  name: Fruit set
  description: Petals fall, small hard green fruit forms among the leaves.
  texture: textures/block/prunus_persica_fruit_set.png
- id: unripe
  name: Unripe fruit
  description: Greenish-white to yellow-green fruit, growing.
  texture: textures/block/prunus_persica_unripe.png
- id: ripe
  name: Ripe fruit
  description: Fruit 5-7 cm across, yellow-orange with a red blush on the sunny side, with a seam on one
    side.
  texture: textures/block/prunus_persica_ripe.png
segment_textures:
- role: trunk_side
  texture: textures/block/prunus_persica_trunk_side.png
  note: Dark grey bark with horizontal lenticels (Wikipedia).
- role: trunk_top
  texture: textures/block/prunus_persica_trunk_top.png
  note: Cut end of the trunk.
reproduction:
  flowers:
    present: true
    colors:
    - pink
    - red
    - white
    opens: day
    season: early spring, before leaves (Feb-May in the north, Aug-Oct in the south)
    pollination:
    - bees
    - self
    notes: Flowers solitary or in pairs, self-fertile but outcrossing about 5%. Bloom is often cut short
      by frost.
  fruit:
    present: true
    type: drupe (stone fruit)
    description: 'Fleshy fruit around a hard, furrowed, pitted stone. Growth is double-sigmoid: fast growth,
      a rest, then fast ripening.'
    ripening: Summer
    edible: 'yes'
uses_real:
- use: Food
  note: Fresh fruit; only apple and pear have higher temperate fruit production.
- use: Ornamental
  note: Planted for blossom; double, semi-double and bicolor flowering forms exist.
- use: Symbol
  note: Regarded as a symbol of longevity in China.
