growth_stages:
- id: sapling
  name: Sapling
  description: Thin whip with a few leaves.
  texture: textures/block/prunus_persica_sapling.png
- id: young_tree
  name: Young tree
  description: Single trunk with smooth red twigs; alternate lanceolate leaves along each twig.
  texture: textures/block/prunus_persica_young.png
- id: budding
  name: Budding
  description: Bare red twigs with swollen pink-tipped buds; flowers come before the leaves in the real
    tree.
  texture: textures/block/prunus_persica_budding.png
- id: blossom
  name: Blossom
  description: Pink flowers (4-5 petals, dark centre) sit directly on the red twigs, with few leaves.
  visual_notes: Leaf blocks replaced by pink blossom leaves.
  texture: textures/block/prunus_persica_blossom.png
- id: fruit_set
  name: Fruit set
  description: Petals fall; small hard green fruits hang from the twigs among alternate leaves.
  texture: textures/block/prunus_persica_fruit_set.png
- id: unripe
  name: Unripe fruit
  description: Greenish-yellow fruits growing on the twigs.
  texture: textures/block/prunus_persica_unripe.png
- id: ripe
  name: Ripe fruit
  description: Ripe fruits 5-7 cm across, yellow-orange with a red blush, hanging from the twigs.
  texture: textures/block/prunus_persica_ripe.png
