implementation:
  type: fruit_tree
  growth:
    summary: Sapling grows into a tree; after maturity the leaves cycle through bud, blossom, fruit set,
      unripe, ripe.
    requirements:
    - Light level 9 or more
    - Grass or dirt below
    - Space for the crown
    flowering: Leaves change to pink blossom leaves during the blossom stage. Timed by tree age plus a
      long random tick cycle (no seasons in vanilla).
    pollination: Bees pollinate blossoms, or self-pollination (the real tree is self-fertile) so fruit
      still forms; bees raise the yield.
    fruiting: Pollinated blossom leaves become fruit-bearing leaves, then ripen through three fruit stages.
    regrowth: Harvesting ripe fruit turns that leaf back to plain leaves; the tree blossoms again next
      cycle.
  spawn:
    biomes:
    - minecraft:plains
    - minecraft:forest
    - minecraft:meadow
    - minecraft:cherry_grove
    feature: tree
    rarity: rare
    reason: Temperate-climate orchard tree; cherry grove is the closest blossom-themed vanilla biome,
      and a bundled orchard village structure is another option.
  drops:
  - peach
  - peach pit
  - sapling
  - stick
  notes: The peach pit is the fruit's seed (plant to get a sapling). The tree's leaves reuse the shared
    flower-and-fruit stage logic.
game_uses:
  summary: Not yet designed (use phase). Peach is edible; blossom colour could give pink dye.
tree_structure:
  data_facts:
  - fact: Crown spread is similar to the height, 3 to 4 m.
    source: 'Wikipedia: Peach'
  - fact: Single trunk only if pruned; branches tend to droop over time.
    source: 'Wikipedia: Peach'
  - fact: Twigs are smooth and hairless, usually red; bark on trunk and branches is dark grey with horizontal
      lenticels.
    source: 'Wikipedia: Peach'
  - fact: Flowers are solitary or in pairs and bloom before the leaves grow.
    source: 'Wikipedia: Peach'
  - fact: Leaves are alternate, oblong to lanceolate, 7-15 cm long.
    source: 'Wikipedia: Peach'
  design:
  - Limb tiers and droop angle are design choices (the source gives no branch geometry).
