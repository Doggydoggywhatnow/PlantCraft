id: datura_leichhardtii
status:
  data: draft
  graphics: done
  implementation: pending
  use: pending
confidence: medium
taxonomy:
  kingdom: Plantae
  clade: Tracheophyta
  order: Solanales
  family: Solanaceae
  genus: Datura
  species: leichhardtii
  authority: F.Muell.
names:
  scientific: Datura leichhardtii
  common:
  - Leichhardt's datura
  in_game: Leichhardt'S Datura
description: Bush 45-90 cm tall, green and slightly furry, with inconspicuous yellowish-white flowers.
  Very fond of heat; prefers the banks of rivers and streams. Not cultivated because its flowers have
  no ornamental value.
habitat:
  native_range: Queensland, the Northern Territory and New South Wales (Australia); may be an early introduction
    from the Americas.
  environment: Near rivers and streams.
  climate: Hot
  height_m: 0.45-0.9
  life_form: shrub
size:
  height_cm:
    min: 45
    max: 90
  habit: bushy
  source: wikipedia
  quote: grows into a bush from 1.5 to 3 ft tall
  height_sources:
  - name: 'Wikipedia: Datura leichhardtii'
    url: https://en.wikipedia.org/wiki/Datura_leichhardtii
    min: 45
    max: 90
    quote: grows into a bush from 1.5 to 3 ft tall
growth_stages:
- id: seed
  name: Seed
  description: Small black seed, flat and kidney-shaped, planted in soil.
  visual_notes: Item sprite only.
  texture: textures/block/datura_leichhardtii_seed.png
- id: seedling
  name: Seedling
  description: Two small green seed leaves on a short stalk.
  visual_notes: Low, 1 pixel stem.
  texture: textures/block/datura_leichhardtii_seedling.png
- id: vegetative
  name: Vegetative
  description: Leafy plant whose stem forks repeatedly into branches, with a leaf at each fork.
  visual_notes: Forking stems (second fork visible), oval leaves at the forks, no flowers.
  texture: textures/block/datura_leichhardtii_vegetative.png
- id: budding
  name: Budding
  description: Long tubular buds form at the ends of the branches.
  visual_notes: Pale furled buds on the branch tips.
  texture: textures/block/datura_leichhardtii_budding.png
- id: flowering
  name: Flowering
  description: A single large trumpet-shaped flower opens at the tip of each branch (flower timing and
    colour in reproduction.flowers).
  visual_notes: One trumpet on each branch tip.
  texture: textures/block/datura_leichhardtii_flowering.png
- id: fruiting
  name: Fruiting
  description: Petals fall and a green spiny seed capsule swells at the tip of each branch.
  visual_notes: Outlined spiny capsule on each branch tip.
  texture: textures/block/datura_leichhardtii_fruiting.png
- id: ripe_capsule
  name: Ripe capsule
  description: Each capsule browns and splits open, showing black seeds, on the branch tips.
  visual_notes: Split brown capsules on the branch tips.
  texture: textures/block/datura_leichhardtii_ripe_capsule.png
reproduction:
  flowers:
    present: true
    colors:
    - yellowish white
    opens: night
    pollination:
    - moths
    notes: Small and inconspicuous. Opening time not stated in the fetched sources.
  fruit:
    present: true
    type: capsule
    description: Spiny capsule about 3.8 cm across.
    edible: toxic
uses_real:
- use: Toxic plant
  note: All Datura species contain tropane alkaloids and are poisonous to people and animals; Wikipedia
    notes use in traditional medicine and ritual (Datura genus article).
