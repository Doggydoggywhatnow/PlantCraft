id: datura_quercifolia
status:
  data: draft
  graphics: done
  implementation: pending
  use: pending
confidence: medium
taxonomy:
  kingdom: Plantae
  clade: Tracheophyta
  order: Solanales
  family: Solanaceae
  genus: Datura
  species: quercifolia
  authority: Kunth
names:
  scientific: Datura quercifolia
  common:
  - oak-leaved thorn-apple
  - Chinese thorn-apple
  in_game: Oak-Leaved Thorn-Apple
description: Small shrub with green leaves resembling oak leaves. Can be prostrate or upright and bushy,
  up to about 0.9 m. Grows in dry or moist soils and needs full sun.
habitat:
  native_range: Mexico and the southwestern United States.
  environment: Dry or moist soil in full sun.
  height_m: up to 0.9
  life_form: shrub
size:
  height_cm:
    max: 90
  habit: bushy
  source: wikipedia
  quote: prostrate or upright bushy habit, bushier forms reaching up to 3 ft
  height_sources:
  - name: 'Wikipedia: Datura quercifolia'
    url: https://en.wikipedia.org/wiki/Datura_quercifolia
    max: 90
    quote: prostrate or upright bushy habit, bushier forms reaching up to 3 ft
  - name: PFAF
    url: https://pfaf.org/user/Plant.aspx?LatinName=Datura+quercifolia
    max: 150
    quote: growing to 1.5 m (5ft)
growth_stages:
- id: seed
  name: Seed
  description: Small black seed, flat and kidney-shaped, planted in soil.
  visual_notes: Item sprite only.
  texture: textures/block/datura_quercifolia_seed.png
- id: seedling
  name: Seedling
  description: Two small green seed leaves on a short stalk.
  visual_notes: Low, 1 pixel stem.
  texture: textures/block/datura_quercifolia_seedling.png
- id: vegetative
  name: Vegetative
  description: Leafy plant whose stem forks repeatedly into branches, with a leaf at each fork.
  visual_notes: Forking stems (second fork visible), oval leaves at the forks, no flowers.
  texture: textures/block/datura_quercifolia_vegetative.png
- id: budding
  name: Budding
  description: Long tubular buds form at the ends of the branches.
  visual_notes: Pale furled buds on the branch tips.
  texture: textures/block/datura_quercifolia_budding.png
- id: flowering
  name: Flowering
  description: A single large trumpet-shaped flower opens at the tip of each branch (flower timing and
    colour in reproduction.flowers).
  visual_notes: One trumpet on each branch tip.
  texture: textures/block/datura_quercifolia_flowering.png
- id: fruiting
  name: Fruiting
  description: Petals fall and a green spiny seed capsule swells at the tip of each branch.
  visual_notes: Outlined spiny capsule on each branch tip.
  texture: textures/block/datura_quercifolia_fruiting.png
- id: ripe_capsule
  name: Ripe capsule
  description: Each capsule browns and splits open, showing black seeds, on the branch tips.
  visual_notes: Split brown capsules on the branch tips.
  texture: textures/block/datura_quercifolia_ripe_capsule.png
reproduction:
  flowers:
    present: true
    colors:
    - white
    - pale violet
    opens: night
    pollination:
    - moths
    notes: Funnel-shaped, under 5 cm long, with five short triangular teeth.
  fruit:
    present: true
    type: capsule
    description: Green capsule armed with long sharp spines; opens by four equal valves.
    edible: toxic
uses_real:
- use: Toxic plant
  note: All Datura species contain tropane alkaloids and are poisonous to people and animals; Wikipedia
    notes use in traditional medicine and ritual (Datura genus article).
