id: datura_quercifolia
status:
  data: draft
  graphics: done
  implementation: pending
  use: pending
confidence: medium
taxonomy:
  kingdom: Plantae
  clade: Tracheophyta
  order: Solanales
  family: Solanaceae
  genus: Datura
  species: quercifolia
  authority: Kunth
names:
  scientific: Datura quercifolia
  common:
  - oak-leaved thorn-apple
  - Chinese thorn-apple
  in_game: Oak-Leaved Thorn-Apple
description: Small shrub with green leaves resembling oak leaves. Can be prostrate or upright and bushy,
  up to about 0.9 m. Grows in dry or moist soils and needs full sun.
habitat:
  native_range: Mexico and the southwestern United States.
  environment: Dry or moist soil in full sun.
  height_m: up to 0.9
  life_form: shrub
growth_stages:
- id: seed
  name: Seed
  description: Small black seed, flat and kidney-shaped, planted in soil.
  visual_notes: Item sprite only.
  texture: textures/block/datura_quercifolia_seed.png
- id: seedling
  name: Seedling
  description: Two small green seed leaves on a short stalk.
  visual_notes: Low, 1 pixel stem.
  texture: textures/block/datura_quercifolia_seedling.png
- id: vegetative
  name: Vegetative
  description: Leafy branched herb or shrub with broad, toothed or wavy leaves.
  visual_notes: Full-height green bush, no flowers.
  texture: textures/block/datura_quercifolia_vegetative.png
- id: budding
  name: Budding
  description: Long tubular buds appear in leaf axils and branch forks, twisted and furled.
  visual_notes: Bush with pale, closed, pencil-like buds.
  texture: textures/block/datura_quercifolia_budding.png
- id: flowering
  name: Flowering
  description: Large trumpet-shaped flowers open (see flower notes for timing and colour).
  visual_notes: Wide trumpet flowers on top of the bush.
  texture: textures/block/datura_quercifolia_flowering.png
- id: fruiting
  name: Fruiting
  description: Petals fall and a green spiny seed capsule swells.
  visual_notes: Green spiny ball where the flower was.
  texture: textures/block/datura_quercifolia_fruiting.png
- id: ripe_capsule
  name: Ripe capsule
  description: Capsule browns and splits open, showing black seeds.
  visual_notes: Brown split capsule with dark seeds visible.
  texture: textures/block/datura_quercifolia_ripe_capsule.png
reproduction:
  flowers:
    present: true
    colors:
    - white
    - pale violet
    opens: night
    pollination:
    - moths
    notes: Funnel-shaped, under 5 cm long, with five short triangular teeth.
  fruit:
    present: true
    type: capsule
    description: Green capsule armed with long sharp spines; opens by four equal valves.
    edible: toxic
uses_real:
- use: Toxic plant
  note: All Datura species contain tropane alkaloids and are poisonous to people and animals; Wikipedia
    notes use in traditional medicine and ritual (Datura genus article).
images:
- url: https://commons.wikimedia.org/wiki/File%3ADatura_quercifolia_flower.jpg
  license: CC BY-SA 3.0
  author: Patrick Alexander
  shows: Datura quercifolia flower
- url: https://commons.wikimedia.org/wiki/File%3ADatura_quercifolia_1.jpg
  license: CC BY-SA 3.0
  author: Patrick Alexander
  shows: Datura quercifolia 1
sources:
- name: 'Wikipedia: Datura quercifolia'
  url: https://en.wikipedia.org/wiki/Datura_quercifolia
  status: checked
- name: Wikidata
  url: https://www.wikidata.org/wiki/Q4118546
  id: Q4118546
  status: checked
- name: 'GBIF (ACCEPTED: Datura quercifolia)'
  url: https://www.gbif.org/species/2928738
  id: '2928738'
  status: checked
- name: Plants of the World Online (Kew)
  url: https://powo.science.kew.org
  status: pending
implementation:
  type: flower_fruit_plant
  growth:
    summary: Grows through the seven genus-template stages (seed to ripe capsule) on random ticks.
    requirements:
    - Light level 9 or more to advance
    - Plantable on sand, dirt, grass or similar soil
    flowering: Flower stage is shown according to flowers.opens; closed or wilted outside those hours.
    pollination: Bees or moths in range, or self-pollination chance per random tick.
    fruiting: Pollinated flower becomes a spiny capsule, which ripens and splits.
    regrowth: Harvested plant returns to the budding stage so it can flower and fruit again.
  spawn:
    biomes:
    - minecraft:badlands
    - minecraft:savanna
    - minecraft:desert
    feature: patch
    rarity: uncommon
    reason: Native to the dry Southwest and Mexico.
  drops:
  - seeds
  - capsule (toxic, not food)
  notes: Very close to D. ferox. Stage list is the shared Datura genus template, not species-specific
    observations.
game_uses:
  summary: Not yet designed (use phase).
