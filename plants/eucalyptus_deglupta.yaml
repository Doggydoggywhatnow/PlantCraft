implementation:
  type: fruit_tree
  growth:
    summary: Very fast-growing tall tree. Sapling to young tree to mature tree, then flowers and woody
      capsules.
    requirements:
    - Full light
    - Wet or moist soil
    - Warm, frost-free biome
    flowering: Leaves show pale stamens during the flowering stage.
    pollination: Not stated in sources.
    fruiting: Flowers become small woody capsules, which release winged seeds.
    regrowth: Tree persists; capsule stage cycles back to flowering.
  spawn:
    biomes:
    - minecraft:jungle
    - minecraft:sparse_jungle
    feature: tree
    rarity: very_rare
    reason: The only Eucalyptus that usually lives in rainforest. IUCN Vulnerable (2019); wild populations
      are severely fragmented and have declined about 30% in 210 years.
  drops:
  - eucalyptus leaves
  - capsules
  - bark strips
  - sapling
  notes: At 1 block = 1 m a typical tree is 60-78 blocks tall with a trunk up to 3 blocks across. Bark
    texture varies per block (trunk_side / trunk_side_alt).
game_uses:
  summary: 'Not yet designed (use phase). Real uses recorded above: pulpwood (paper) and ornamental.'
