id: chara_braunii
status:
  data: draft
  graphics: done
  implementation: pending
  use: not_applicable
confidence: medium
taxonomy:
  kingdom: Plantae
  clade: Charophyta
  order: Charales
  family: Characeae
  genus: Chara
  species: braunii
  authority: C.C.Gmel.
names:
  scientific: Chara braunii
  common:
  - Braun's stonewort
  in_game: Braun's Stonewort
description: Small to medium green alga (a stonewort, order Charales) that grows underwater from the muddy
  bottom. Fresh green to brownish green, transparent and richly branched, with a slender main axis up
  to 1.2 mm across. Whorls of 6-10 branchlets. Entirely ecorticate (has no outer cortex layer). Monoecious
  and richly fertile, with the oogonia above the antheridia; the oospore is dark brown or black. It is
  the first Charophyceae to have its whole nuclear genome sequenced.
habitat:
  native_range: Cosmopolitan between 65 N and 35 S.
  environment: Still fresh water over muddy bottoms; in Poland found only in fish ponds, but elsewhere
    in many other waters.
  life_form: alga
  height_m: small, not stated
size:
  height_cm:
    max: 1
  habit: aquatic_tuft
  source: pending
  quote: No height figure in the fetched sources; max is a placeholder, not data.
growth_stages:
- id: spore
  name: Oospore
  description: Dark brown or black oospore resting on the muddy bottom.
  texture: textures/block/chara_braunii_spore.png
- id: sprout
  name: Sprout
  description: Short slender green axis with the first small whorl of branchlets.
  texture: textures/block/chara_braunii_sprout.png
- id: growing
  name: Growing
  description: Taller axis with several whorls of 6-10 straight branchlets, transparent bright green.
  texture: textures/block/chara_braunii_growing.png
- id: fertile
  name: Fertile
  description: Fully branched with oogonia and antheridia at the nodes, oogonia above antheridia.
  texture: textures/block/chara_braunii_fertile.png
reproduction:
  flowers:
    present: false
    opens: not_applicable
    pollination:
    - not_applicable
    notes: Algae have no flowers. Reproduces by oospores from oogonia (female) and antheridia (male) on
      the same plant.
  fruit:
    present: false
    type: oospore
    edible: not_applicable
    description: Dark oospore; no fruit.
