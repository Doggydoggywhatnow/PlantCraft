  in_game: Pricklyburr
description: Tuberous-rooted subshrub 0.6-1.5 m tall, stems and leaves covered in short soft grey hairs
  giving a grey look. Crushed foliage smells foul, like rancid peanut butter, though the flowers are pleasantly
  scented.
habitat:
  native_range: Americas (genus is centred on Mexico); exact native range to be confirmed against Kew.
  environment: To be confirmed (sources pending).
  height_m: 0.6-1.5
  life_form: perennial_herb
size:
  height_cm:
    min: 60
    max: 150
  habit: bushy
  source: wikipedia
  quote: typically reaches a height of 0.6 to 1.5 metres
  spread_cm:
    min: 91
    max: 183
  spread_sources:
