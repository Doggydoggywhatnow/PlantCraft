growth_stages:
- id: seed
  name: Seed
  description: Small black seed, flat and kidney-shaped, planted in soil.
  visual_notes: Item sprite only.
  texture: textures/block/datura_innoxia_seed.png
- id: seedling
  name: Seedling
  description: Two small green seed leaves on a short stalk.
  visual_notes: Low, 1 pixel stem.
  texture: textures/block/datura_innoxia_seedling.png
- id: vegetative
  name: Vegetative
  description: Leafy branched herb or shrub with broad, toothed or wavy leaves.
  visual_notes: Full-height green bush, no flowers.
  texture: textures/block/datura_innoxia_vegetative.png
- id: budding
  name: Budding
  description: Long tubular buds appear in leaf axils and branch forks, twisted and furled.
  visual_notes: Bush with pale, closed, pencil-like buds.
  texture: textures/block/datura_innoxia_budding.png
- id: flowering
  name: Flowering
  description: Large trumpet-shaped flowers open (see flower notes for timing and colour).
  visual_notes: Wide trumpet flowers on top of the bush.
  texture: textures/block/datura_innoxia_flowering.png
- id: fruiting
  name: Fruiting
  description: Petals fall and a green spiny seed capsule swells.
  visual_notes: Green spiny ball where the flower was.
  texture: textures/block/datura_innoxia_fruiting.png
- id: ripe_capsule
  name: Ripe capsule
  description: Capsule browns and splits open, showing black seeds.
  visual_notes: Brown split capsule with dark seeds visible.
  texture: textures/block/datura_innoxia_ripe_capsule.png
segment_textures:
- role: lower
  texture: textures/block/datura_innoxia_lower.png
  note: Leafy stem block placed under the stage texture when this plant grows past 1 block (real height
    > 1 m).
reproduction:
  flowers:
    present: true
    colors:
    - white
    opens: night
    season: early summer to late autumn
    pollination:
    - moths
    notes: White trumpets 12-19 cm long that first grow upright and later incline downward. Bloom at night.
  fruit:
    present: true
    type: capsule
    description: Egg-shaped spiny capsule about 5 cm across; splits open irregularly when ripe. Seeds
      can lie dormant in soil for many years.
    edible: toxic
uses_real:
- use: Toxic plant
  note: All Datura species contain tropane alkaloids and are poisonous to people and animals; Wikipedia
    notes use in traditional medicine and ritual (Datura genus article).
