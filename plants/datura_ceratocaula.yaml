id: datura_ceratocaula
status:
  data: draft
  graphics: pending
  implementation: pending
  use: pending
confidence: medium
taxonomy:
  kingdom: Plantae
  clade: Tracheophyta
  order: Solanales
  family: Solanaceae
  genus: Datura
  species: ceratocaula
  authority: Ortega
names:
  scientific: Datura ceratocaula
  common:
  - swamp datura
  - Latin thorn-apple
  in_game: Swamp Datura
description: Annual that grows in shallow water or swamp. Hollow grey-green stalk 30-90 cm long, curved
  like an animal's horn (ceratocaulus means horn stem), forking less than other species. Toothed, undulate,
  ovate-lanceolate leaves, hairy underneath.
habitat:
  native_range: Mexico.
  environment: Shallow water and swamps.
  height_m: 0.3-0.9
  life_form: annual_herb
growth_stages:
- id: seed
  name: Seed
  description: Small black seed, flat and kidney-shaped, planted in soil.
  visual_notes: Item sprite only.
  texture: textures/block/datura_ceratocaula_seed.png
- id: seedling
  name: Seedling
  description: Two small green seed leaves on a short stalk.
  visual_notes: Low, 1 pixel stem.
  texture: textures/block/datura_ceratocaula_seedling.png
- id: vegetative
  name: Vegetative
  description: Leafy branched herb or shrub with broad, toothed or wavy leaves.
  visual_notes: Full-height green bush, no flowers.
  texture: textures/block/datura_ceratocaula_vegetative.png
- id: budding
  name: Budding
  description: Long tubular buds appear in leaf axils and branch forks, twisted and furled.
  visual_notes: Bush with pale, closed, pencil-like buds.
  texture: textures/block/datura_ceratocaula_budding.png
- id: flowering
  name: Flowering
  description: Large trumpet-shaped flowers open (see flower notes for timing and colour).
  visual_notes: Wide trumpet flowers on top of the bush.
  texture: textures/block/datura_ceratocaula_flowering.png
- id: fruiting
  name: Fruiting
  description: Petals fall and a green spiny seed capsule swells.
  visual_notes: Green spiny ball where the flower was.
  texture: textures/block/datura_ceratocaula_fruiting.png
- id: ripe_capsule
  name: Ripe capsule
  description: Capsule browns and splits open, showing black seeds.
  visual_notes: Brown split capsule with dark seeds visible.
  texture: textures/block/datura_ceratocaula_ripe_capsule.png
reproduction:
  flowers:
    present: true
    colors:
    - white with a blue cast outside
    - white to pink inside
    opens: night
    season: June to September
    pollination:
    - moths
    notes: Broad funnel-shaped, sweetly scented. Opening time not stated in the fetched sources, so night
      is the genus default.
  fruit:
    present: true
    type: capsule
    description: 'Smooth, not thorny: dangling inverted-egg shape. The only Datura here with a spineless
      capsule.'
    edible: toxic
uses_real:
- use: Toxic plant
  note: All Datura species contain tropane alkaloids and are poisonous to people and animals; Wikipedia
    notes use in traditional medicine and ritual (Datura genus article).
images:
- url: https://commons.wikimedia.org/wiki/File%3ADatura_ceratocaula.jpg
  license: Public domain
  author: W. Curtis
  shows: Datura ceratocaula
sources:
- name: 'Wikipedia: Datura ceratocaula'
  url: https://en.wikipedia.org/wiki/Datura_ceratocaula
  status: checked
- name: Wikidata
  url: https://www.wikidata.org/wiki/Q5227799
  id: Q5227799
  status: checked
- name: 'GBIF (ACCEPTED: Datura ceratocaula)'
  url: https://www.gbif.org/species/3798966
  id: '3798966'
  status: checked
- name: Plants of the World Online (Kew)
  url: https://powo.science.kew.org
  status: pending
implementation:
  type: flower_fruit_plant
  growth:
    summary: Grows through the seven genus-template stages (seed to ripe capsule) on random ticks.
    requirements:
    - Light level 9 or more to advance
    - Plantable on sand, dirt, grass or similar soil
    flowering: Flower stage is shown according to flowers.opens; closed or wilted outside those hours.
    pollination: Bees or moths in range, or self-pollination chance per random tick.
    fruiting: Pollinated flower becomes a spiny capsule, which ripens and splits.
    regrowth: Harvested plant returns to the budding stage so it can flower and fruit again.
  spawn:
    biomes:
    - minecraft:swamp
    - minecraft:mangrove_swamp
    feature: single
    rarity: uncommon
    reason: Grows in shallow water and swamps.
  drops:
  - seeds
  - capsule (toxic, not food)
  notes: 'Must be placeable in or beside shallow water. Authority: Wikipedia/Kew say Ortega, GBIF says
    Jacq. Stage list is the shared Datura genus template, not species-specific observations.'
  behavior: shallow_water_plant
game_uses:
  summary: Not yet designed (use phase).
