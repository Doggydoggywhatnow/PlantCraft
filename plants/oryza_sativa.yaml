growth_stages:
- id: seed
  name: Grain
  description: The grain (caryopsis) inside its husk, planted directly in the field or sown in a seedbed.
    Grain colours include white, brown, black and red.
  texture: textures/block/oryza_sativa_seed.png
- id: seedling
  name: Seedling
  description: A few thin blades from a small clump with fibrous roots; seedlings are often raised in
    a seedbed and transplanted.
  visual_notes: Three thin blades and a root fan.
  texture: textures/block/oryza_sativa_seedling.png
- id: tillering
  name: Tillering
  description: The plant makes several leafy upright stems (tillers); each jointed stem has a long slender
    leaf at every node.
  visual_notes: A fan of 5 tillers with arching blades.
  texture: textures/block/oryza_sativa_tillering.png
- id: flowering
  name: Flowering
  description: A branched panicle arises from the last internode of the stem, carrying spikelets whose
    anthers and ovules are self-fertile.
  visual_notes: Upright pale-green panicle with yellow anthers.
  texture: textures/block/oryza_sativa_flowering.png
- id: ripe
  name: Ripe
  description: Fertilised ovules fill into grain and the panicle bends under its weight; the grain is
    ready when its moisture is 20-25% and the plant yellows.
  visual_notes: Golden drooping panicle branches heavy with grain.
  texture: textures/block/oryza_sativa_ripe.png
segment_textures:
- role: lower
  texture: textures/block/oryza_sativa_lower.png
  note: 'Lower block of a plant taller than 1 block: upright jointed tillers with leaf blades, matching
    the top block''s stems at the join.'
reproduction:
  flowers:
    present: true
    pollination:
    - self
    opens: not_applicable
    notes: Self-fertile flowers in a panicle of up to 350 spikelets. Flower colour and opening time are
      not stated in the fetched sources.
  fruit:
    present: true
    type: caryopsis (grain)
    description: The edible grain; colours include white, brown, black (purple when cooked) and red. Ready
      to harvest at 20-25% moisture.
    ripening: About six months from seed to harvest
    edible: 'yes'
uses_real:
- use: Cereal food crop
  note: Grown for its edible grain; Asian rice is the much more common of the two cultivated rice species.
- use: Ratoon crop
  note: Normally an annual, but in the tropics it can survive as a perennial and produce a second (ratoon)
    crop.
- use: Model organism
  note: Genome of 430 Mbp across 12 chromosomes; a model for the biology of cereals and monocots.
