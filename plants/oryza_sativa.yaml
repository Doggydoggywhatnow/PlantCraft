description: Annual grass with an erect, smooth, jointed stalk 80-120 cm tall; a single plant makes several
  leafy stems (tillers). A long slender lanceolate leaf (15-30 cm) arises from each node. The self-fertile
  flowers are in a panicle, a branched inflorescence that arises from the last internode, with up to 350
  spikelets, each holding male (anthers) and female (ovule) parts. A fertilised ovule becomes the edible
  grain (caryopsis). About six months from seed to harvest. The more common of the two cultivated rice
  species (the other is African rice, O. glaberrima).
habitat:
  native_range: A crop; first domesticated from the wild rice Oryza rufipogon in the Yangtze River basin
    of China (13,500-8,200 years ago per the Oryza sativa article; about 9,000 years ago per the Rice
    article).
  introduced_range: Spread worldwide by cultivation, migration and trade; reached the Americas after 1492.
  environment: 'Lowland paddies: fields surrounded by bunds and flooded a few centimetres deep until about
    a week before harvest; also dry-land and rainfed upland fields. Does not thrive if continuously submerged;
    deepwater varieties tolerate over 50 cm of flooding for at least a month. Prefers moist or wet soil;
    cannot grow in shade (PFAF).'
  climate: Tropical and warm; two seasons (dry and wet) with enough water
  life_form: annual_herb
  height_m: 0.8-1.2 (over 1 m; up to 5 m in deep water)
